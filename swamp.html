<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Swamp Feast</title>
<style>html,body{margin:0;height:100%;background:#0d1a10;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
#cap{position:fixed;bottom:18px;width:100%;text-align:center;color:#f4f0c8;font:bold 22px Georgia,serif;text-shadow:0 2px 6px #000}</style></head>
<body><canvas id="c"></canvas><div id="cap"></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),cap=document.getElementById('cap');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
const flies=Array.from({length:25},()=>({x:Math.random(),y:Math.random()*.6,p:Math.random()*6}));
const frogs=[{x:.72,y:.8},{x:.85,y:.83},{x:.62,y:.86}];
const T=14;// loop seconds
function ogre(cx,cy,s,t,phase){
 x.save();x.translate(cx,cy);x.scale(s,s);
 // body
 x.fillStyle='#6b4a2b';x.beginPath();x.ellipse(0,60,70,80,0,0,7);x.fill();
 x.fillStyle='#8a6a3f';x.fillRect(-70,40,140,18);
 // head
 x.fillStyle='#7fae3c';x.beginPath();x.ellipse(0,-40,55,50,0,0,7);x.fill();
 // ear stalks
 x.beginPath();x.moveTo(-50,-60);x.lineTo(-80,-80);x.lineTo(-70,-55);x.fill();
 x.beginPath();x.moveTo(50,-60);x.lineTo(80,-80);x.lineTo(70,-55);x.fill();
 // eyes
 x.fillStyle='#fff';[-20,20].forEach(e=>{x.beginPath();x.arc(e,-50,10,0,7);x.fill()});
 x.fillStyle='#222';[-20,20].forEach(e=>{x.beginPath();x.arc(e+(phase==3?0:3),-50,4,0,7);x.fill()});
 // mouth
 x.fillStyle='#3b1d10';x.beginPath();
 if(phase==3){x.ellipse(0,-12,26,22+Math.sin(t*30)*3,0,0,7)}else{const m=Math.abs(Math.sin(t*8))*8;x.ellipse(0,-15,18,3+m,0,0,7)}
 x.fill();
 if(phase==3){x.fillStyle='#fff';x.fillRect(-14,-32,6,8);x.fillRect(8,-32,6,8)}
 // arms
 x.strokeStyle='#7fae3c';x.lineWidth=18;x.lineCap='round';
 const a=phase==1?Math.sin(t*6)*0.5:0;
 x.beginPath();x.moveTo(-55,30);x.lineTo(-85,-5+a*30);x.stroke();
 x.beginPath();x.moveTo(55,30);x.lineTo(phase==3?110:85,phase==3?-40:-5-a*30);x.stroke();
 // food in hands
 if(phase<3){
  // drumstick
  x.save();x.translate(-88,-10+a*30);x.rotate(-0.6);
  x.fillStyle='#c98a3c';x.beginPath();x.ellipse(0,0,14,10,0,0,7);x.fill();
  x.fillStyle='#f3ead4';x.fillRect(10,-3,14,6);x.restore();
  // pizza slice
  x.save();x.translate(88,-10-a*30);x.rotate(0.4);
  x.fillStyle='#e8b04a';x.beginPath();x.moveTo(0,-18);x.lineTo(-14,14);x.lineTo(14,14);x.fill();
  x.fillStyle='#c0392b';[[0,-4],[-5,6],[5,7]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill()});
  x.restore();
 }
 x.restore();
}
const OFF=parseFloat(new URLSearchParams(location.search).get('t')||0);
function draw(ts){
 const t=ts/1000+OFF, lt=t%T, phase=lt<3?0:lt<8?1:lt<10?2:3;
 cap.textContent=['Night falls on the swamp...','Dinner time: fried chicken and pizza!','Uh oh... uninvited guests.','ROOOAAAR!'][phase];
 // sky
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2f3a');g.addColorStop(.6,'#2c4a2a');g.addColorStop(1,'#1b2d14');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 // moon
 x.fillStyle='#f5f1c8';x.beginPath();x.arc(W*.82,H*.15,40,0,7);x.fill();
 // trees
 x.fillStyle='#10200f';for(let i=0;i<7;i++){const tx=i*W/6-30;x.fillRect(tx,H*.25,24,H*.5);x.beginPath();x.arc(tx+12,H*.25,70,0,7);x.fill()}
 // water
 x.fillStyle='#233b1f';x.fillRect(0,H*.72,W,H*.28);
 x.strokeStyle='rgba(160,200,140,.25)';x.lineWidth=2;
 for(let i=0;i<8;i++){x.beginPath();const yy=H*.76+i*14;for(let xx=0;xx<W;xx+=20)x.lineTo(xx,yy+Math.sin(xx/40+t*2+i)*3);x.stroke()}
 // mud mound
 x.fillStyle='#3d2f1a';x.beginPath();x.ellipse(W*.35,H*.8,190,50,0,0,7);x.fill();
 // food props: bucket + pizza box
 const bx=W*.18,by=H*.74;
 x.fillStyle='#b22222';x.beginPath();x.moveTo(bx-28,by-55);x.lineTo(bx+28,by-55);x.lineTo(bx+20,by);x.lineTo(bx-20,by);x.fill();
 x.fillStyle='#fff';x.fillRect(bx-24,by-40,48,8);
 x.fillStyle='#c98a3c';for(let i=0;i<4;i++){x.beginPath();x.ellipse(bx-15+i*10,by-58,8,7,0,0,7);x.fill()}
 x.fillStyle='#c9a36a';x.fillRect(W*.45,H*.77,90,16);x.fillStyle='#e8b04a';x.fillRect(W*.45+6,H*.765,78,6);
 // ogre
 const bob=Math.sin(t*2)*4;
 ogre(W*.35,H*.62+bob,Math.min(W,H)/620,t,phase);
 // flies
 x.fillStyle='#ddd';flies.forEach(f=>{const fx=f.x*W+Math.sin(t*3+f.p)*20,fy=f.y*H+Math.cos(t*4+f.p)*10;x.beginPath();x.arc(fx,fy,2,0,7);x.fill()});
 // frogs approach then flee
 frogs.forEach((f,i)=>{
  let fx=f.x*W, fy=f.y*H;
  if(phase==0)fx+=W*.3;
  else if(phase==1)fx+=W*.3*(1-(lt-3)/5);
  else if(phase==2)fx+=Math.sin(t*20+i)*2;
  else{const k=(lt-10)/4;fx+=W*.6*k*k*4;fy-=Math.abs(Math.sin(t*12+i))*40}
  x.fillStyle='#4f8a2b';x.beginPath();x.ellipse(fx,fy,22,14,0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(fx-8,fy-12,6,0,7);x.arc(fx+8,fy-12,6,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(fx-8,fy-12,phase==3?4:2.5,0,7);x.arc(fx+8,fy-12,phase==3?4:2.5,0,7);x.fill();
 });
 // roar lines
 if(phase==3){x.strokeStyle='rgba(255,240,180,.7)';x.lineWidth=4;
  for(let r=0;r<3;r++){const rr=((lt-10)*180+r*60)%240+40;x.beginPath();x.arc(W*.35+60,H*.55,rr,-0.6,0.6);x.stroke()}}
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
