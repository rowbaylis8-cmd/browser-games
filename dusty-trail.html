function candidates(){const L=[],add=(o,r,l,f,pr)=>{const d=D(P,o);if(d<r)L.push({d:d-(pr||0),l,f})};
 if(P.inside!=null){for(const s of spots(P.inside)){const d=Math.hypot(P.ix-s.x,P.iy-s.y);if(d<70)L.push({d,l:s.l,f:s.f})}return L}

 for(const h of horses)if(h.reg==reg&&h.wild&&h.kind=='raptor')add(h,75,has('meat')?'Feed Raw Meat to tame the raptor':'Raptor (bring Raw Meat to tame)',()=>{if(!has('meat')){msg('You need Raw Meat. Hunt raptors or buy it at a trader.');S.deny();return}takeG('meat');h.wild=false;h.owned=true;h.hp=6;dinoCall('raptor');banner('TAMED! Raptor mount','Fast and agile - press E to ride');horses.filter(o=>o.kind=='raptor'&&o.wild).forEach(o=>o.flee=4)});
 for(let i=0;i<6;i++)add(door(i),42,'Enter '+REG[reg].b[i],()=>{if(P.mounted)dismount(true);enter(i)});
 add(board,85,(()=>{const n=miss.find(m=>m.reg==reg&&!m.done&&!m.act);return n?'Bounty board: '+n.t+' ($'+reward(n)+')':'Bounty board (nothing new here)'})(),()=>takeMission(),25);
 if(reg==0)add(wagon,80,"Trade at Ol' Pickett's Wagon",()=>open('trade',{wagon:true}));
